<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASSISTANT IA LESFACILITATEURS</title>

<style>

/* =========================================================
   ASSISTANT IA LESFACILITATEURS
   STYLE ULTRA MODERNE — MOBILE + DESKTOP
========================================================= */

:root{
    --primary:#075e54;
    --primary2:#128c7e;
    --green:#25d366;
    --light:#efeae2;
    --white:#ffffff;
    --text:#17202a;
    --muted:#667085;
    --border:#e1e5e9;
    --shadow:0 4px 18px rgba(0,0,0,.12);
    --radius:16px;
}

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:var(--light);
    color:var(--text);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:70px;

    display:flex;
    align-items:center;
    gap:12px;

    padding:8px 12px;

    background:
        linear-gradient(
            135deg,
            #075e54,
            #128c7e
        );

    color:white;

    box-shadow:
        0 2px 12px rgba(0,0,0,.25);

    z-index:1000;
}

.menu-btn{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    background:transparent;
    color:white;

    font-size:28px;

    border-radius:50%;

    cursor:pointer;

    transition:.2s;
}

.menu-btn:active{
    background:rgba(255,255,255,.15);
    transform:scale(.92);
}

.avatar{
    width:45px;
    height:45px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #fff,
            #e8fff7
        );

    color:#075e54;

    font-size:25px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.2);
}

.header b{
    display:block;
    font-size:15px;
    line-height:1.2;
}

.header small{
    display:block;
    margin-top:4px;
    font-size:12px;
    color:#d8fff5;
}

/* =========================================================
   MENU LATÉRAL
========================================================= */

.menu{
    position:fixed;

    top:0;
    left:-310px;

    width:290px;
    max-width:85vw;
    height:100vh;

    padding:85px 16px 20px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #f4faf8
        );

    box-shadow:
        8px 0 30px rgba(0,0,0,.25);

    z-index:3000;

    overflow-y:auto;

    transition:
        left .3s ease;

    border-right:1px solid #ddd;
}

.menu.active{
    left:0;
}

.menu::before{
    content:"ASSISTANT IA";
    position:absolute;
    top:25px;
    left:20px;

    font-size:18px;
    font-weight:bold;

    color:var(--primary);
}

.menu button{
    width:100%;
    min-height:48px;

    margin-bottom:10px;

    padding:12px 15px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--primary2),
            var(--primary)
        );

    color:white;

    font-size:14px;
    font-weight:bold;

    text-align:left;

    cursor:pointer;

    box-shadow:
        0 3px 8px rgba(0,0,0,.12);

    transition:.2s;
}

.menu button:hover{
    transform:translateX(3px);
}

.menu button:active{
    transform:scale(.97);
}

/* =========================================================
   SERVICES DANS LE MENU
========================================================= */

#listeServices{
    margin-bottom:8px;
}

#listeServices button{
    background:#e8f7f3;
    color:#075e54;

    border:1px solid #c8ebe3;

    box-shadow:none;

    font-size:13px;
}

/* =========================================================
   CHAT
========================================================= */

.chat{
    position:fixed;

    top:70px;
    bottom:76px;
    left:0;
    right:0;

    padding:15px 10px 20px;

    overflow-y:auto;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.4),
            transparent 30%
        ),
        #efeae2;

    scroll-behavior:smooth;
}

/* Barre scroll */

.chat::-webkit-scrollbar,
#fenetreAnnonces::-webkit-scrollbar,
#fenetreStatuts::-webkit-scrollbar,
.menu::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb,
#fenetreAnnonces::-webkit-scrollbar-thumb,
#fenetreStatuts::-webkit-scrollbar-thumb,
.menu::-webkit-scrollbar-thumb{
    background:#999;
    border-radius:20px;
}

/* =========================================================
   MESSAGES
========================================================= */

.message{
    position:relative;

    max-width:min(78%,650px);

    padding:10px 13px;

    margin:7px 0;

    border-radius:16px;

    line-height:1.5;

    font-size:14px;

    word-break:break-word;

    white-space:pre-wrap;

    box-shadow:
        0 2px 6px rgba(0,0,0,.08);

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.user{
    margin-left:auto;

    background:
        linear-gradient(
            135deg,
            #dcf8c6,
            #d0f5b9
        );

    color:#111;

    border-bottom-right-radius:4px;
}

.ai{
    margin-right:auto;

    background:white;

    color:#111;

    border-bottom-left-radius:4px;
}

.message a{
    word-break:break-all;
}

/* =========================================================
   FOOTER CHAT
========================================================= */

.footer{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    min-height:76px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:10px;

    background:
        rgba(255,255,255,.96);

    border-top:1px solid #ddd;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.08);

    z-index:5000;
}

#message{
    flex:1;

    min-width:0;

    height:52px;

    border:1px solid #d0d5d9;

    border-radius:27px;

    padding:0 18px;

    outline:none;

    background:#f7f8f9;

    color:#111;

    font-size:15px;

    transition:.2s;
}

#message:focus{
    border-color:#25d366;

    background:white;

    box-shadow:
        0 0 0 3px rgba(37,211,102,.12);
}

#send{
    width:52px;
    height:52px;

    flex:none;

    border:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #25d366,
            #16a85a
        );

    color:white;

    font-size:23px;

    cursor:pointer;

    box-shadow:
        0 4px 12px rgba(37,211,102,.35);

    transition:.2s;
}

#send:active{
    transform:scale(.9);
}

/* =========================================================
   FENÊTRE ANNONCES
========================================================= */

#fenetreAnnonces{
    display:none;

    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    background:#f2f5f4;

    overflow-y:auto;

    -webkit-overflow-scrolling:touch;

    z-index:99999;

    padding-bottom:35px;
}

/* =========================================================
   HEADER ANNONCES
========================================================= */

.annonces-header{
    position:sticky;

    top:0;

    min-height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    padding:10px 14px;

    background:
        linear-gradient(
            135deg,
            #075e54,
            #128c7e
        );

    color:white;

    box-shadow:
        0 3px 12px rgba(0,0,0,.2);

    z-index:30;
}

.annonces-header b{
    display:block;

    font-size:16px;

    line-height:1.2;
}

.annonces-header small{
    display:block;

    margin-top:5px;

    color:#d9fff6;

    font-size:11px;
}

#fermerAnnonces{
    width:42px;
    height:42px;

    flex:none;

    border:0;

    border-radius:50%;

    background:#e53935;

    color:white;

    font-size:17px;

    cursor:pointer;

    box-shadow:
        0 3px 8px rgba(0,0,0,.25);
}

/* =========================================================
   RECHERCHE ANNONCES
========================================================= */

.annonces-recherche{
    position:sticky;

    top:70px;

    z-index:25;

    padding:10px;

    background:
        rgba(255,255,255,.97);

    border-bottom:1px solid #ddd;
}

#rechercheAnnonce{
    width:100%;
    height:48px;

    border:1px solid #d6dadd;

    border-radius:25px;

    padding:0 18px;

    outline:none;

    background:#f7f8f9;

    font-size:14px;

    transition:.2s;
}

#rechercheAnnonce:focus{
    background:white;

    border-color:#128c7e;

    box-shadow:
        0 0 0 3px rgba(18,140,126,.12);
}

/* =========================================================
   CATÉGORIES
========================================================= */

#categoriesAnnonces{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:10px;

    background:white;

    border-bottom:1px solid #ddd;

    scrollbar-width:none;
}

#categoriesAnnonces::-webkit-scrollbar{
    display:none;
}

.categorie-annonce{
    flex:none;

    border:0;

    padding:9px 15px;

    border-radius:22px;

    background:#e7f3f0;

    color:#075e54;

    font-size:12px;

    font-weight:bold;

    white-space:nowrap;

    cursor:pointer;

    transition:.2s;
}

.categorie-annonce.active{
    background:
        linear-gradient(
            135deg,
            #075e54,
            #128c7e
        );

    color:white;

    box-shadow:
        0 3px 8px rgba(7,94,84,.25);
}

.categorie-annonce:active{
    transform:scale(.94);
}

/* =========================================================
   LISTE ANNONCES
========================================================= */

#listeAnnonces{
    width:100%;

    padding:0 0 10px;
}

.groupe-annonces{
    display:flex;

    flex-direction:column;

    gap:12px;

    padding:0 10px 15px;
}

/* =========================================================
   TITRE VILLE
========================================================= */

.titre-ville{
    margin:14px 10px 9px;

    padding:11px 13px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #075e54,
            #128c7e
        );

    color:white;

    font-size:14px;

    font-weight:bold;

    box-shadow:
        0 3px 8px rgba(0,0,0,.12);
}

/* =========================================================
   CARTE ANNONCE
========================================================= */

.carte-annonce{
    width:100%;

    padding:16px;

    border-radius:17px;

    background:white;

    box-shadow:
        0 4px 14px rgba(0,0,0,.10);

    border-left:6px solid #25d366;

    transition:
        transform .2s,
        box-shadow .2s;

    overflow:hidden;
}

.carte-annonce:active{
    transform:scale(.985);
}

/* Couleurs */

.carte-annonce:nth-child(6n+1){
    background:#eaf5ff;
    border-left-color:#2196f3;
}

.carte-annonce:nth-child(6n+2){
    background:#edfaef;
    border-left-color:#4caf50;
}

.carte-annonce:nth-child(6n+3){
    background:#fff7e9;
    border-left-color:#ff9800;
}

.carte-annonce:nth-child(6n+4){
    background:#fff0f5;
    border-left-color:#e91e63;
}

.carte-annonce:nth-child(6n+5){
    background:#f3efff;
    border-left-color:#673ab7;
}

.carte-annonce:nth-child(6n+6){
    background:#e9fbfd;
    border-left-color:#00acc1;
}

/* Badge */

.carte-annonce .badge{
    display:inline-flex;

    align-items:center;

    padding:6px 10px;

    border-radius:20px;

    background:rgba(255,255,255,.8);

    color:#075e54;

    font-size:11px;

    font-weight:bold;

    border:1px solid rgba(0,0,0,.05);
}

/* Titre */

.carte-annonce h3{
    margin:9px 0;

    color:#075e54;

    font-size:18px;

    line-height:1.25;
}

/* Texte */

.carte-annonce p{
    margin:6px 0;

    font-size:13px;

    line-height:1.5;

    color:#29313a;
}

.carte-annonce .contact{
    margin-top:10px;

    font-size:14px;

    font-weight:bold;

    color:#075e54;
}

/* =========================================================
   ACTIONS ANNONCES
========================================================= */

.actions-annonce{
    display:flex;

    gap:8px;

    margin-top:14px;
}

.actions-annonce a{
    flex:1;

    min-height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:9px;

    border-radius:22px;

    color:white;

    text-decoration:none;

    font-size:12px;

    font-weight:bold;

    box-shadow:
        0 3px 7px rgba(0,0,0,.12);

    transition:.2s;
}

.actions-annonce a:active{
    transform:scale(.95);
}

.btn-appeler{
    background:
        linear-gradient(
            135deg,
            #2196f3,
            #1976d2
        );
}

.btn-whatsapp{
    background:
        linear-gradient(
            135deg,
            #25d366,
            #16a85a
        );
}

/* =========================================================
   AUCUNE ANNONCE
========================================================= */

.aucune-annonce{
    margin:30px 15px;

    padding:30px 20px;

    text-align:center;

    background:white;

    border-radius:18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    color:#667085;
}

.aucune-annonce b{
    color:#075e54;
}

/* =========================================================
   FIN ANNONCES
========================================================= */

#finAnnonces{
    margin:10px;

    padding:20px 15px;

    text-align:center;

    border-radius:16px;

    background:white;

    color:#667085;

    font-size:12px;

    line-height:1.6;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

/* =========================================================
   FENÊTRE STATUTS
========================================================= */

#fenetreStatuts{
    display:none;

    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    background:#050505;

    overflow-y:auto;

    z-index:99999;

    padding:65px 10px 25px;
}

#listeStatuts{
    width:100%;
    max-width:800px;

    margin:auto;
}

#listeStatuts img{
    width:100%;
    height:auto;

    display:block;

    margin:18px auto;

    border-radius:16px;

    object-fit:contain;

    box-shadow:
        0 5px 20px rgba(0,0,0,.5);
}

#listeStatuts audio{
    width:100%;

    margin:18px 0;
}

#listeStatuts iframe{
    width:100%;

    min-height:500px;

    border:0;

    border-radius:14px;

    background:#111;
}

/* =========================================================
   BOUTON FERMER STATUTS
========================================================= */

#fermerStatuts{
    position:fixed;

    top:10px;
    right:10px;

    min-height:42px;

    padding:10px 15px;

    border:0;

    border-radius:22px;

    background:#e53935;

    color:white;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 3px 10px rgba(0,0,0,.4);
}

/* =========================================================
   MODE SOMBRE
========================================================= */

body.sombre{
    background:#101414;
    color:white;
}

body.sombre .header{
    background:
        linear-gradient(
            135deg,
            #043d37,
            #075e54
        );
}

body.sombre .chat{
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.03),
            transparent 30%
        ),
        #121818;
}

body.sombre .ai{
    background:#252d2d;
    color:#f5f5f5;
}

body.sombre .user{
    background:#056162;
    color:white;
}

body.sombre .footer{
    background:#181d1d;
    border-color:#333;
}

body.sombre #message{
    background:#272d2d;
    border-color:#444;
    color:white;
}

body.sombre #message:focus{
    background:#303737;
}

body.sombre .menu{
    background:
        linear-gradient(
            180deg,
            #1b2222,
            #121818
        );

    border-color:#333;
}

body.sombre .menu::before{
    color:#25d366;
}

body.sombre #listeServices button{
    background:#263b38;
    color:#8ff0d4;
    border-color:#345c55;
}

body.sombre #fenetreAnnonces{
    background:#101414;
}

body.sombre .annonces-recherche{
    background:#181d1d;
    border-color:#333;
}

body.sombre #rechercheAnnonce{
    background:#252b2b;
    color:white;
    border-color:#444;
}

body.sombre #categoriesAnnonces{
    background:#181d1d;
    border-color:#333;
}

body.sombre .categorie-annonce{
    background:#263b38;
    color:#9cebd8;
}

body.sombre .categorie-annonce.active{
    background:#075e54;
    color:white;
}

body.sombre .titre-ville{
    background:#075e54;
}

body.sombre .carte-annonce{
    background:#222929;
    color:white;
}

body.sombre .carte-annonce p{
    color:#e0e5e5;
}

body.sombre .carte-annonce h3{
    color:#25d366;
}

body.sombre .carte-annonce .badge{
    background:#333d3d;
    color:#8ff0d4;
}

body.sombre .aucune-annonce,
body.sombre #finAnnonces{
    background:#222929;
    color:#b8c0c0;
}

/* =========================================================
   RESPONSIVE TABLETTE
========================================================= */

@media(min-width:601px){

    .chat{
        padding-left:8%;
        padding-right:8%;
    }

    .footer{
        padding-left:12%;
        padding-right:12%;
    }

    #listeAnnonces{
        max-width:900px;
        margin:auto;
    }

    .groupe-annonces{
        padding-left:15px;
        padding-right:15px;
    }

}

/* =========================================================
   RESPONSIVE PETIT TÉLÉPHONE
========================================================= */

@media(max-width:380px){

    .header{
        gap:7px;
        padding:8px;
    }

    .header b{
        font-size:13px;
    }

    .header small{
        font-size:10px;
    }

    .avatar{
        width:40px;
        height:40px;
        font-size:21px;
    }

    .menu-btn{
        width:40px;
        height:40px;
        font-size:25px;
    }

    .message{
        max-width:86%;
        font-size:13px;
    }

    .footer{
        padding:8px;
    }

    #message{
        height:48px;
        font-size:14px;
        padding-left:15px;
    }

    #send{
        width:48px;
        height:48px;
    }

    .actions-annonce a{
        font-size:11px;
    }

}

/* =========================================================
   ACCESSIBILITÉ / TOUCH
========================================================= */

button,
a,
input{
    -webkit-tap-highlight-color:transparent;
}

button{
    touch-action:manipulation;
}

a{
    -webkit-touch-callout:none;
}

/* =========================================================
   EMPÊCHE LES IMAGES DE DÉFORMER LES CARTES
========================================================= */

img{
    max-width:100%;
}

/* =========================================================
   SÉLECTION
========================================================= */

::selection{
    background:#25d366;
    color:white;
}

</style>

</head>

let historique = [];

function chargerMemoire(){

    try{

        const sauvegarde =
            localStorage.getItem("historiqueIA");

        if(sauvegarde){

            const data =
                JSON.parse(sauvegarde);

            if(Array.isArray(data)){
                historique = data;
            }

        }

    }catch(e){

        console.warn(
            "Mémoire locale indisponible.",
            e
        );

        historique = [];

    }

}


function sauvegarderHistorique(role, texte){

    try{

        historique.push({

            role: role,
            texte: String(texte || ""),
            date: new Date().toLocaleString()

        });

        localStorage.setItem(
            "historiqueIA",
            JSON.stringify(historique)
        );

    }catch(e){

        console.warn(
            "Impossible de sauvegarder l'historique.",
            e
        );

    }

}


chargerMemoire();

function(texte){

};


const ancienneFonctionIA =
    ajouterIA;

/* RECHERCHE DANS LES ANNONCES */
/* ================================= */

function analyserBesoin(message){

let q=
message
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


let mots=
q.split(/\s+/)
.filter(function(m){

return m.length>2;

});


let resultat=[];


ANNONCES.forEach(function(a){


let texte=`

${a.categorie || ""}

${a.objet || ""}

${a.ville || ""}

${a.quartier || ""}

${a.age || ""}

${a.budget || ""}

${a.description || ""}

${a.contact || ""}

`
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


let score=0;


mots.forEach(function(m){

if(texte.includes(m)){

score++;

}

});


/*
Mots importants
*/

if(
q.includes("menagere")
&&
texte.includes("menagere")
){

score+=8;

}


if(
q.includes("nkomo")
&&
texte.includes("nkomo")
){

score+=8;

}


if(
q.includes("yaounde")
&&
texte.includes("yaounde")
){

score+=5;

}


if(
q.includes("douala")
&&
texte.includes("douala")
){

score+=5;

}


if(
q.includes("chambre")
&&
texte.includes("chambre")
){

score+=7;

}


if(
q.includes("studio")
&&
texte.includes("studio")
){

score+=7;

}


if(
q.includes("maçon")
||
q.includes("macon")
){

if(
texte.includes("maçon")
||
texte.includes("macon")
){

score+=6;

}

}


if(score>0){

resultat.push({

annonce:a,

score:score

});

}

});


resultat.sort(function(a,b){

return b.score-a.score;

});


return resultat;

}


/* ================================= */
/* RECHERCHE BASE CONNAISSANCE */
/* ================================= */

function chercherConnaissance(message){

let texte=
message.toLowerCase();


let meilleurScore=0;

let meilleureReponse=null;


BASE_CONNAISSANCE.forEach(function(item){

let score=0;


item.questions.forEach(function(q){

q=q.toLowerCase();


if(texte.includes(q)){

score+=100;

}


let mots=
q.split(/\s+/);


mots.forEach(function(mot){

if(
mot.length>2
&&
texte.includes(mot)
){

score++;

}

});

});


if(score>meilleurScore){

meilleurScore=score;

meilleureReponse=
item.reponse;

}

});


return meilleureReponse;

}

    let categories = ["toutes"];

    ANNONCES.forEach(function(a){

        if(
            a.categorie &&
            !categories.includes(a.categorie)
        ){
            categories.push(a.categorie);
        }

    });

    categoriesAnnonces.innerHTML = "";

    categories.forEach(function(cat){

            categorieActuelle = cat;

            afficherCategories();

            afficherAnnonces();

        };

        categoriesAnnonces.appendChild(bouton);

    });

}

    /* FILTRAGE */
    /* ============================= */

    let annoncesFiltrees = ANNONCES.filter(function(a){

        let categorieOK =
            categorieActuelle === "toutes"
            ||
            a.categorie === categorieActuelle;


        let texte = (

            (a.categorie || "") + " " +
            (a.objet || "") + " " +
            (a.ville || "") + " " +
            (a.quartier || "") + " " +
            (a.age || "") + " " +
            (a.budget || "") + " " +
            (a.description || "") + " " +
            (a.contact || "")

        )
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");


        let rechercheOK =
            recherche === ""
            ||
            texte.includes(recherche);


        return categorieOK && rechercheOK;

    });


    let zone =
        document.getElementById("listeAnnonces");


    zone.innerHTML = "";


    /* ============================= */
    /* AUCUNE ANNONCE */
    /* ============================= */

    if(annoncesFiltrees.length === 0){

        zone.innerHTML = `

        <div class="aucune-annonce">

            😔

            <br><br>
 <b>
            Aucune annonce trouvée
            </b>

            <br><br>

            Essayez une autre catégorie,
            une autre ville ou un autre mot.

        </div>

        `;

        return;

    }


    /* ============================= */
    /* REGROUPEMENT PAR VILLE */
    /* ============================= */

    let villes = {};


    annoncesFiltrees.forEach(function(a){

        let ville =
            a.ville || "Autres";


        if(!villes[ville]){

            villes[ville] = [];

        }


        villes[ville].push(a);

    });


    /* ============================= */
    /* AFFICHAGE PAR VILLE */
    /* ============================= */

    Object.keys(villes).forEach(function(ville){

        let bloc =
            document.createElement("div");


        bloc.innerHTML = `

        <div class="titre-ville">

            📍 ANNONCES DE
            ${ville.toUpperCase()}

        </div>

        `;


        let groupe =
            document.createElement("div");


        groupe.className =
            "groupe-annonces";


        /* ============================= */
        /* CHAQUE ANNONCE */
        /* ============================= */

        villes[ville].forEach(function(a){

            let numero =
                (a.contact || "")
                .replace(/\D/g,"");


            let numeroWA =
                numero;


            if(
                numero &&
                !numero.startsWith("237")
            ){

                numeroWA =
                    "237" + numero;

            }


            let carte =
                document.createElement("div");


            carte.className =
                "carte-annonce";


            carte.innerHTML = `

            <span class="badge">

                ${nomCategorie(
                    a.categorie
                )}

            </span>


            <h3>

                ${a.objet || "Annonce"}

            </h3>


            <p>

                📝

                ${a.description || ""}

            </p>


            ${
                a.ville
                ?
                `
                <p>

                    📍 <b>Ville :</b>

                    ${a.ville}

                </p>
                `
                :
                ""
            }


            ${
                a.quartier
                ?
                `
                <p>

                    🏘️ <b>Quartier :</b>

                    ${a.quartier}

                </p>
                `
                :
                ""
            }


            ${
                a.age
                ?
                `
                <p>

                    🎂 <b>Âge :</b>

                    ${a.age}

                </p>
                `
                :
                ""
            }


            ${
                a.budget
                ?
                `
                <p>

                    💰 <b>Prix/Budget :</b>

                    ${a.budget}

                </p>
                `
                :
                ""
            }


            ${
                a.contact
                ?
                `
                <p class="contact">

                    📞 ${a.contact}

                </p>
                `
                :
                ""
            }


            <div class="actions-annonce">


                ${
                    numero
                    ?
                    `
                    <a
                    class="btn-appeler"
                    href="tel:+${numeroWA}"
                    >

                    📞 Appeler

                    </a>
                    `
                    :
                    ""
                }


                ${
                    numero
                    ?
                    `
                    <a
                    class="btn-whatsapp"
                    href="https://wa.me/${numeroWA}?text=${encodeURIComponent(
                        "Bonjour, je suis intéressé par votre annonce : "
                        +
                        (a.objet || "")
                    )}"
                    target="_blank"
                    >

                    💬 WhatsApp

                    </a>
                    `
                    :
                    ""
                }


            </div>

            `;


            groupe.appendChild(
                carte
            );

        });


        bloc.appendChild(
            groupe
        );


        zone.appendChild(
            bloc
        );

    });


    /* ============================= */
    /* RETOUR EN HAUT */
    /* ============================= */

    document
    .getElementById("fenetreAnnonces")
    .scrollTop = 0;

}

document
.getElementById("invite")
.onclick=function(){

    const lien =
        window.location.href;

    if(
        navigator.share
    ){

        navigator.share({

            title:
            "Assistant IA Lesfacilitateurs",

            text:
            "Découvrez mon assistant IA",

            url:lien

        }).catch(function(e){

            console.log(
                "Partage annulé ou indisponible.",
                e
            );

        });

        return;

    }


    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
        .writeText(lien)
        .then(function(){

            alert(
                "Lien d'invitation copié"
            );

        })
        .catch(function(){

            alert(
                "Impossible de copier automatiquement le lien."
            );

        });

        return;

    }


    /* Solution compatible avec les anciens navigateurs */

    try{

        const zone =
            document.createElement("textarea");

        zone.value = lien;

        zone.style.position =
            "fixed";

        zone.style.opacity =
            "0";

        document.body.appendChild(zone);

        zone.select();

        document.execCommand("copy");

        document.body.removeChild(zone);

        alert(
            "Lien d'invitation copié"
        );

    }catch(e){

        alert(
            "Lien : " + lien
        );

    }

};

/* ================================= */
/* MODE SOMBRE */
/* ================================= */

document
.getElementById("dark")
.onclick=function(){

    document.body.classList.toggle("sombre");

    try{

        if(
            document.body.classList.contains("sombre")
        ){

            localStorage.setItem(
                "theme",
                "sombre"
            );

        }else{

            localStorage.removeItem(
                "theme"
            );

        }

    }catch(e){

        console.warn(
            "Impossible de sauvegarder le thème.",
            e
        );

    }

};


/* ================================= */
/* RESTAURATION MODE SOMBRE */
/* ================================= */

try{

    if(
        localStorage.getItem("theme")
        ===
        "sombre"
    ){

        document.body.classList.add(
            "sombre"
        );

    }

}catch(e){

    console.warn(
        "Thème local indisponible.",
        e
    );

}

function chargerHistorique(){

let historique = [];

try {

    historique = JSON.parse(
        localStorage.getItem("historiqueIA") || "[]"
    );

    if (!Array.isArray(historique)) {
        historique = [];
    }

} catch (e) {

    historique = [];

    localStorage.removeItem("historiqueIA");

}


let chat=
document.getElementById(
"chat"
);


if(
historique.length===0
){

return;

}


chat.innerHTML="";


historique.forEach(
function(m){

if(
m.role==="user"
){

chat.innerHTML+=`

<div class="message user">

${m.texte}

</div>

`;

}

else{

chat.innerHTML+=`

<div class="message ai">

<b>
🌝 Assistant IA Lesfacilitateurs
</b>

<br><br>

${rendreLiensCliquables(
m.texte
)}

</div>

`;

}

});


chat.scrollTop=
chat.scrollHeight;

}
