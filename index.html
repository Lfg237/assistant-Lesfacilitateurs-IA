/* ================================= */

function rendreLiensCliquables(texte){

if(!texte) return "";

return texte.replace(
/(https?:\/\/[^\s]+)/g,
function(lien){

return `<a
href="${lien}"
target="_blank"
rel="noopener noreferrer"
style="
color:#0084ff;
font-weight:bold;
text-decoration:underline;
">

${lien}

</a>`;

});

}

/* ================================= */

/* ================================= */

let historique = [];

try {
    historique = JSON.parse(
        localStorage.getItem("historiqueIA") || "[]"
    );

    if (!Array.isArray(historique)) {
        historique = [];
    }

} catch (e) {

    console.warn("Historique corrompu, réinitialisation.");

    historique = [];

    localStorage.removeItem("historiqueIA");
}


function sauvegarderHistorique(
role,
texte
){

historique.push({

role:role,

texte:texte,

date:new Date().toLocaleString()

});


localStorage.setItem(
"historiqueIA",
JSON.stringify(historique)
);


}


const ancienUtilisateur=
ajouterUtilisateur;


ajouterUtilisateur=function(texte){

ancienUtilisateur(texte);

sauvegarderHistorique(
"user",
texte
);

};

ajouterIA;

/* ================================= */
/* RECHERCHE DANS LES ANNONCES */
/* ================================= */

function analyserBesoin(message){

let q=
message
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


let mots=
q.split(/\s+/)
.filter(function(m){

return m.length>2;

});


let resultat=[];


ANNONCES.forEach(function(a){


let texte=`

${a.categorie || ""}

${a.objet || ""}

${a.ville || ""}

${a.quartier || ""}

${a.age || ""}

${a.budget || ""}

${a.description || ""}

${a.contact || ""}

`
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


let score=0;


mots.forEach(function(m){

if(texte.includes(m)){

score++;

}

});


/*
Mots importants
*/

if(
q.includes("menagere")
&&
texte.includes("menagere")
){

score+=8;

}


if(
q.includes("nkomo")
&&
texte.includes("nkomo")
){

score+=8;

}


if(
q.includes("yaounde")
&&
texte.includes("yaounde")
){

score+=5;

}


if(
q.includes("douala")
&&
texte.includes("douala")
){

score+=5;

}


if(
q.includes("chambre")
&&
texte.includes("chambre")
){

score+=7;

}


if(
q.includes("studio")
&&
texte.includes("studio")
){

score+=7;

}


if(
q.includes("maçon")
||
q.includes("macon")
){

if(
texte.includes("maçon")
||
texte.includes("macon")
){

score+=6;

}

}


if(score>0){

resultat.push({

annonce:a,

score:score

});

}

});


resultat.sort(function(a,b){

return b.score-a.score;

});


return resultat;

}


/* ================================= */
/* RECHERCHE BASE CONNAISSANCE */
/* ================================= */

function chercherConnaissance(message){

let texte=
message.toLowerCase();


let meilleurScore=0;

let meilleureReponse=null;


BASE_CONNAISSANCE.forEach(function(item){

let score=0;


item.questions.forEach(function(q){

q=q.toLowerCase();


if(texte.includes(q)){

score+=100;

}


let mots=
q.split(/\s+/);


mots.forEach(function(mot){

if(
mot.length>2
&&
texte.includes(mot)
){

score++;

}

});

});


if(score>meilleurScore){

meilleurScore=score;

meilleureReponse=
item.reponse;

}

});


return meilleureReponse;

}

/* ================================= */
/* AFFICHER ANNONCES */
/* ================================= */

function afficherAnnonces(){

    afficherCategories();

    let recherche =
        rechercheAnnonce.value
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");


    /* ============================= */
    /* FILTRAGE */
    /* ============================= */

    let annoncesFiltrees = ANNONCES.filter(function(a){

        let categorieOK =
            categorieActuelle === "toutes"
            ||
            a.categorie === categorieActuelle;


        let texte = (

            (a.categorie || "") + " " +
            (a.objet || "") + " " +
            (a.ville || "") + " " +
            (a.quartier || "") + " " +
            (a.age || "") + " " +
            (a.budget || "") + " " +
            (a.description || "") + " " +
            (a.contact || "")

        )
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");


        let rechercheOK =
            recherche === ""
            ||
            texte.includes(recherche);


        return categorieOK && rechercheOK;

    });


    let zone =
        document.getElementById("listeAnnonces");


    zone.innerHTML = "";


    /* ============================= */
    /* AUCUNE ANNONCE */
    /* ============================= */

    if(annoncesFiltrees.length === 0){

        zone.innerHTML = `

        <div class="aucune-annonce">

            😔

            <br><br>
 <b>
            Aucune annonce trouvée
            </b>

            <br><br>

            Essayez une autre catégorie,
            une autre ville ou un autre mot.

        </div>

        `;

        return;

    }


    /* ============================= */
    /* REGROUPEMENT PAR VILLE */
    /* ============================= */

    let villes = {};


    annoncesFiltrees.forEach(function(a){

        let ville =
            a.ville || "Autres";


        if(!villes[ville]){

            villes[ville] = [];

        }


        villes[ville].push(a);

    });


    /* ============================= */
    /* AFFICHAGE PAR VILLE */
    /* ============================= */

    Object.keys(villes).forEach(function(ville){

        let bloc =
            document.createElement("div");


        bloc.innerHTML = `

        <div class="titre-ville">

            📍 ANNONCES DE
            ${ville.toUpperCase()}

        </div>

        `;


        let groupe =
            document.createElement("div");


        groupe.className =
            "groupe-annonces";


        /* ============================= */
        /* CHAQUE ANNONCE */
        /* ============================= */

        villes[ville].forEach(function(a){

            let numero =
                (a.contact || "")
                .replace(/\D/g,"");


            let numeroWA =
                numero;


            if(
                numero &&
                !numero.startsWith("237")
            ){

                numeroWA =
                    "237" + numero;

            }


            let carte =
                document.createElement("div");


            carte.className =
                "carte-annonce";


            carte.innerHTML = `

            <span class="badge">

                ${nomCategorie(
                    a.categorie
                )}

            </span>


            <h3>

                ${a.objet || "Annonce"}

            </h3>


            <p>

                📝

                ${a.description || ""}

            </p>


            ${
                a.ville
                ?
                `
                <p>

                    📍 <b>Ville :</b>

                    ${a.ville}

                </p>
                `
                :
                ""
            }


            ${
                a.quartier
                ?
                `
                <p>

                    🏘️ <b>Quartier :</b>

                    ${a.quartier}

                </p>
                `
                :
                ""
            }


            ${
                a.age
                ?
                `
                <p>

                    🎂 <b>Âge :</b>

                    ${a.age}

                </p>
                `
                :
                ""
            }


            ${
                a.budget
                ?
                `
                <p>

                    💰 <b>Prix/Budget :</b>

                    ${a.budget}

                </p>
                `
                :
                ""
            }


            ${
                a.contact
                ?
                `
                <p class="contact">

                    📞 ${a.contact}

                </p>
                `
                :
                ""
            }


            <div class="actions-annonce">


                ${
                    numero
                    ?
                    `
                    <a
                    class="btn-appeler"
                    href="tel:+${numeroWA}"
                    >

                    📞 Appeler

                    </a>
                    `
                    :
                    ""
                }


                ${
                    numero
                    ?
                    `
                    <a
                    class="btn-whatsapp"
                    href="https://wa.me/${numeroWA}?text=${encodeURIComponent(
                        "Bonjour, je suis intéressé par votre annonce : "
                        +
                        (a.objet || "")
                    )}"
                    target="_blank"
                    >

                    💬 WhatsApp

                    </a>
                    `
                    :
                    ""
                }


            </div>

            `;


            groupe.appendChild(
                carte
            );

        });


        bloc.appendChild(
            groupe
        );


        zone.appendChild(
            bloc
        );

    });


    /* ============================= */
    /* RETOUR EN HAUT */
    /* ============================= */

    document
    .getElementById("fenetreAnnonces")
    .scrollTop = 0;

}

border-radius:15px;
"
>

`;

}


else if(
s.type==="audio"
){

zone.innerHTML+=`

<audio
controls
style="
width:100%;
margin:20px 0;
"
>

<source
src="${s.url}"
type="audio/mpeg"
>

</audio>

`;

}


else if(
s.type==="iframe"
){

zone.innerHTML+=`

<iframe
src="${s.url}"
style="
width:100%;
height:500px;
border:none;
margin-top:20px;
"
allowfullscreen
></iframe>

`;

}

});


document
.getElementById(
"fenetreStatuts"
)
.style.display="block";

}


/* ================================= */
/* BOUTON STATUTS */
/* ================================= */

document
.getElementById("statuts")
.onclick=function(){

afficherStatuts();

menu.classList.remove(
"active"
);

};


/* ================================= */
/* FERMER STATUTS */
/* ================================= */

document
.getElementById(
"fermerStatuts"
)
.onclick=function(){

document
.getElementById(
"fenetreStatuts"
)
.style.display="none";

};


/* ================================= */
/* TOUCHE ESC */
/* ================================= */

document.addEventListener(
"keydown",
function(e){

if(
e.key==="Escape"
){

document
.getElementById(
"fenetreStatuts"
)
.style.display="none";


fenetreAnnonces
.style.display="none";

}

});

window.addEventListener(

function(){

chargerHistorique();

afficherServices();

});
