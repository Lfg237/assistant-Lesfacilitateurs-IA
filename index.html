// ===============================
// ANALYSE BESOIN
// ===============================


function analyserBesoin(message){


let q =
message.toLowerCase();



let resultat=[];



ANNONCES.forEach(function(a){



let texte=

(
a.categorie+
" "+
a.objet+
" "+
a.ville+
" "+
a.quartier+
" "+
a.description

).toLowerCase();




let mots=q.split(" ");



let score=0;



mots.forEach(function(m){


if(
m.length>2
&&
texte.includes(m)
){

score++;

}


});



if(score>0){


resultat.push({

annonce:a,

score:score

});


}



});





resultat.sort(function(a,b){

return b.score-a.score;

});



return resultat;

}








// ===============================
// REMPLACEMENT REPONSE IA
// ===============================



function chercherConnaissance(message){

    let texte = message.toLowerCase();

    let meilleurScore = 0;
    let meilleureReponse = null;

    BASE_CONNAISSANCE.forEach(function(item){

        let score = 0;

        item.questions.forEach(function(q){

            q = q.toLowerCase();

            if(texte.includes(q)){
                score += 100;
            }

            let mots = q.split(/\s+/);

            mots.forEach(function(mot){

                if(
                    mot.length > 2 &&
                    texte.includes(mot)
                ){
                    score++;
                }

            });

        });

        if(score > meilleurScore){

            meilleurScore = score;
            meilleureReponse = item.reponse;

        }

    });

    return meilleureReponse;

}


function envoyerMessage(){

    let input=document.getElementById("message");
    let texte=input.value.trim();

    if(texte==="") return;

    ajouterUtilisateur(texte);

    input.value="";

    setTimeout(function(){

        let reponse="";

        // Recherche dans la base de connaissances
        let connaissance = chercherConnaissance(texte);

        if(connaissance){
            reponse += connaissance + "\n\n";
        }

        // Recherche dans les annonces
        let annonces = analyserBesoin(texte);

        if(annonces.length){

            let a = annonces[0].annonce;

            reponse += `
━━━━━━━━━━━━━━

📢 ANNONCE DISPONIBLE

📌 ${a.objet}

📝 ${a.description}

📍 ${a.ville}

🏘 ${a.quartier}

💰 ${a.budget} FCFA

📞 ${a.contact}
`;
        }

        // Si rien trouvé
        if(reponse===""){

            reponse=`
😔oups Je n'ai trouvé aucune information.

Essayez de préciser :
📌 votre besoin
📍 votre ville
🏘 votre quartier
💰 votre budget
`;
        }

        ajouterIA(reponse);

    },500);

}

                        display:block;
                        margin:20px auto;
                        border-radius:15px;
                    "
                >
            `;

        }


        else if(s.type === "audio"){

            zone.innerHTML += `
                <audio
                    controls
                    style="
                        width:100%;
                        margin:20px 0;
                    "
                >
                    <source src="${s.url}" type="audio/mpeg">
                </audio>
            `;

        }


        else if(s.type === "iframe"){

            zone.innerHTML += `
                <iframe
                    src="${s.url}"
                    style="
                        width:100%;
                        height:500px;
                        border:none;
                        margin-top:20px;
                    "
                    allowfullscreen
                ></iframe>
            `;

        }

    });


    document.getElementById("fenetreStatuts").style.display = "block";

}


// ======================================
// BOUTON STATUTS
// ======================================

document.getElementById("statuts").onclick = function(){

    afficherStatuts();

    menu.classList.remove("active");

};


// ======================================
// FERMER LES STATUTS
// ======================================

document.getElementById("fermerStatuts").onclick = function(){

    document.getElementById("fenetreStatuts").style.display = "none";

};


// ======================================
// FERMER AVEC ESC
// ======================================

document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        document.getElementById("fenetreStatuts").style.display = "none";

    }

});


// ======================================
// DÉMARRAGE
// ======================================

window.addEventListener("load", function(){

    chargerHistorique();

    afficherServices();

});

</script>
