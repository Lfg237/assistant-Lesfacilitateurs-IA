function etapePertinente(domain,key,data){
 if(domain!=="immobilier") return true;
 const type=normaliserTexte(data.type);
 // Terrain et emplacement n'ont pas de chambres.
 if(key==="chambres") return /maison|appartement|studio|chambre/.test(type) && !/terrain|emplacement/.test(type);
 return true;
}

function prochaineEtape(flow,index,data){
 while(index<flow.steps.length && !etapePertinente(conversation.domain,flow.steps[index][0],data)) index++;
 return index;
}

function detecterDomaine(t){
 if(/maison|appartement|studio|chambre|terrain|emplacement|immobilier|louer|acheter une maison|acheter un appartement|a louer|a vendre/.test(t))return"immobilier";
 if(/emploi|travail|recrutement|job|poste|menagere|nounou|chauffeur|macon/.test(t))return"employ";
 if(/telephone|tv|television|chaussure|produit|acheter|acheter en ligne/.test(t))return"ecommerce";
 if(/agriculture|agronomie|poulet|porcelet|mais a vendre/.test(t))return"agronomie";
 if(/electricien|plombier|climaticien|technicien|reparation/.test(t))return"technicien";
 if(/chien|chiot|chat|animal|race/.test(t))return"animal";
 if(/btp|construction|construire|batiment|travaux publics/.test(t))return"btp";
 if(/site web|site internet|creation de site/.test(t))return"site";
 if(/application|appli|app mobile/.test(t))return"app";
 if(/logo/.test(t))return"logo";
 if(/flyer|affiche/.test(t))return"flyer";
 if(/montage video|video publicitaire/.test(t))return"video";
 if(/musique|chanson|dedicace|mariage.*chanson/.test(t))return"music";
 if(/formation|apprendre|cours/.test(t))return"formation";
 if(/ia|intelligence artificielle|automatiser/.test(t))return"ia";
 if(/publicite|visibilite|promotion|booster/.test(t))return"publicite";
 if(/paiement|payement|orange money|mtn money/.test(t))return"paiement";
 if(/cv|lettre de motivation|devis|document|contrat/.test(t))return"documents";
 if(/installation|maintenance|climatisation|equipement/.test(t))return"maintenance";
 return null;
}

function demarrerConversation(domain){

function valeurLisible(v){return String(v||"").trim();}

function nombreBudget(v){
 const t=normaliserTexte(v).replace(/fcfa|francs?|xof/g," ").replace(/\s+/g," ").trim();
 const m=t.match(/([0-9][0-9\s.,]*)(?:\s*(million|millions|m|mille|k))?/);
 if(!m)return null;
 let n=parseFloat(m[1].replace(/[\s,]/g,""));
 if(!isFinite(n))return null;
 const u=m[2]||"";
 if(/million|m$/.test(u))n*=1000000;
 else if(/mille|k/.test(u))n*=1000;
 return n;
}

function typeImmobilierCorrespond(aType, objet, categorie){
 const t=normaliserTexte(aType), x=normaliserTexte([objet,categorie].join(" "));
 if(!t)return true;
 if(t.includes("terrain"))return x.includes("terrain");
 if(t.includes("emplacement"))return x.includes("emplacement");
 if(t.includes("maison"))return x.includes("maison");
 if(t.includes("appartement"))return x.includes("appartement");
 if(t.includes("studio")||t.includes("chambre"))return x.includes("studio")||x.includes("chambre");
 return x.includes(t);
}

function transactionCorrespond(transaction,a){
 const tr=normaliserTexte(transaction); if(!tr)return true;
 const x=normaliserTexte([a.transaction,a.type_transaction,a.objet,a.description].join(" "));
 // Si l'annonce contient explicitement la transaction, on la respecte.
 if(a.transaction||a.type_transaction){
   if(tr.includes("louer")||tr.includes("location"))return /louer|location/.test(x);
   if(tr.includes("acheter")||tr.includes("vente")||tr.includes("vendre"))return /acheter|vente|vendre/.test(x);
 }
 // Pour les anciennes annonces sans champ transaction, on ne bloque pas la recherche.
 return true;
}

     const x=normaliserTexte([a.objet,a.description,a.categorie].join(" "));
     if(!x.includes(normaliserTexte(d.animal)))return false;

 }).slice(0,5);

}

function creerLienAutomatique(url,libelle){
    const lien=document.createElement("a");
    lien.href=url;
    lien.target="_blank";
    lien.rel="noopener noreferrer";
    lien.textContent=libelle||url;
    lien.className="lien-automatique";
    return lien;
}

function ajouterTexteAvecLiens(parent,texte){
    const contenu=String(texte||"");
    const regex=/(https?:\/\/[^\s<>]+|www\.[^\s<>]+)/gi;
    let dernier=0,match;
    while((match=regex.exec(contenu))!==null){
        if(match.index>dernier){
            parent.appendChild(document.createTextNode(contenu.slice(dernier,match.index)));
        }
        let url=match[0];
        let suffixe="";
        while(/[.,;:!?)]$/.test(url)){ suffixe=url.slice(-1)+suffixe; url=url.slice(0,-1); }
        const href=url.toLowerCase().startsWith("www.")?"https://"+url:url;
        parent.appendChild(creerLienAutomatique(href,url));
        if(suffixe)parent.appendChild(document.createTextNode(suffixe));
        dernier=match.index+match[0].length;
    }
    if(dernier<contenu.length){
        parent.appendChild(document.createTextNode(contenu.slice(dernier)));
    }
}

function afficherReponseIA(texte){
    if(!chat)return null;
    const message=document.createElement("div");
    message.className="message ai";

    /* Les réponses peuvent contenir des URL n'importe où.
       On accepte seulement quelques balises de mise en forme sûres,
       puis on transforme automatiquement chaque URL en lien cliquable. */
    const source=document.createElement("div");
    source.innerHTML=String(texte||"");

    function parcourir(noeud,parent){
        if(noeud.nodeType===Node.TEXT_NODE){
            ajouterTexteAvecLiens(parent,noeud.nodeValue);
            return;
        }
        if(noeud.nodeType!==Node.ELEMENT_NODE)return;

        const nom=noeud.tagName.toLowerCase();
        if(nom==="br"){ parent.appendChild(document.createElement("br")); return; }

        if(nom==="a") {
            const href=noeud.getAttribute("href")||"";
            if(/^https?:\/\//i.test(href)){
                const lien=creerLienAutomatique(href,noeud.textContent.trim()||href);
                parent.appendChild(lien);
                return;
            }
        }

        const autorise=["strong","b","em","i","u","span","div","p"];
        if(autorise.indexOf(nom)!==-1){
            const bloc=document.createElement(nom==="div"||nom==="p"?"div":nom);
            if(nom==="div"||nom==="p")bloc.style.display="block";
            for(const enfant of noeud.childNodes)parcourir(enfant,bloc);
            parent.appendChild(bloc);
            if(nom==="div"||nom==="p")parent.appendChild(document.createElement("br"));
            return;
        }

        /* Balise inconnue : on conserve son contenu textuel sans exécuter son HTML. */
        for(const enfant of noeud.childNodes)parcourir(enfant,parent);
    }

    for(const enfant of source.childNodes)parcourir(enfant,message);
    chat.appendChild(message);
    chat.scrollTop=chat.scrollHeight;
    return message;
}

function motsRecherche(texte){
    return normaliserTexte(texte)
        .replace(/[^a-z0-9\s]/g," ")
        .split(/\s+/)
        .filter(function(m){return m.length>=3;});
}

function chercherConnaissances(texte){
    const question=normaliserTexte(texte);
    if(!question)return [];
    const qWords=motsRecherche(question);
    const synonymes={
        musique:["musique","musicale","musical","chanson","son","sons","audio"],
        formation:["formation","formations","cours","apprendre","apprentissage"],
        emploi:["emploi","travail","job","recrutement","poste","rechercheur","chercheur"],
        immobilier:["immobilier","maison","appartement","studio","chambre","terrain","emplacement"],
        publicite:["publicite","visibilite","promotion","booster","pub"],
        paiement:["paiement","payement","payer","orange","mtn"],
        ecommerce:["ecommerce","commerce","produit","vente","acheter","boutique"]
    };
    const expand=function(words){
        const out=words.slice();
        Object.keys(synonymes).forEach(function(g){
            if(words.some(function(w){return synonymes[g].indexOf(w)!==-1;})) synonymes[g].forEach(function(x){if(out.indexOf(x)===-1)out.push(x);});
        });
        return out;
    };
    const expanded=expand(qWords);
    const resultats=[];
    BASE_CONNAISSANCE.forEach(function(item,index){
        if(!item||!Array.isArray(item.questions))return;
        let score=0;
        item.questions.forEach(function(mot){
            const cle=normaliserTexte(mot);
            if(!cle)return;
            if(question===cle) score=Math.max(score,1000);
            else if(question.includes(cle)) score=Math.max(score,700+Math.min(cle.length,100));
            else if(cle.includes(question)&&question.length>=4) score=Math.max(score,500);
            const words=motsRecherche(cle);
            let commun=0;
            words.forEach(function(w){if(expanded.indexOf(w)!==-1)commun++;});
            if(commun) score=Math.max(score,300+commun*45+Math.min(words.length,10)*5);
        });
        if(score>0)resultats.push({score:score,index:index,reponse:item.reponse});
    });
    resultats.sort(function(a,b){return b.score-a.score;});
    return resultats.slice(0,4);
}

function chercherConnaissance(texte){
    const resultats=chercherConnaissances(texte);
    if(!resultats.length)return null;
    const vus=new Set();
    return resultats.map(function(r){return r.reponse;}).filter(function(rep){
        const cle=normaliserTexte(rep);
        if(vus.has(cle))return false;
        vus.add(cle);
        return true;
    }).join("\n\n");
}

function envoyerMessage(texte){
const demande=String(texte||"").trim();if(!demande)return;
ajouterMessage(demande,"user");if(messageInput)messageInput.value="";
const t=normaliserTexte(demande);
if(t==="annuler"||t==="stop"||t==="recommencer"||t==="nouvelle recherche"){conversation.active=false;conversation.domain=null;conversation.step=0;conversation.data={};setTimeout(function(){afficherReponseIA("✅ Conversation réinitialisée.\n\nQue souhaitez-vous rechercher ou faire ?")},200);return;}
setTimeout(function(){
if(conversation.active){afficherReponseIA(continuerConversation(demande));return;}
const domaine=detecterDomaine(t);
if(domaine){demarrerConversation(domaine);return;}
afficherReponseIA(obtenirReponse(demande));
},250);
}

if(sendBtn)sendBtn.addEventListener("click",function(){envoyerMessage(messageInput?messageInput.value:"")});

function creerCarteAnnonce(annonce){
const carte=document.createElement("article");
carte.className="carte-annonce";

const badge=document.createElement("span");
badge.className="badge";
badge.textContent=annonce.categorie||"Annonce";
carte.appendChild(badge);

const titre=document.createElement("h3");
titre.textContent=annonce.objet||"Annonce";
carte.appendChild(titre);

if(annonce.ville||annonce.quartier){
const lieu=document.createElement("p");
lieu.textContent="📍 "+[annonce.ville,annonce.quartier].filter(Boolean).join(" — ");
carte.appendChild(lieu);
}

if(annonce.age){
const age=document.createElement("p");age.textContent="👤 Âge : "+annonce.age;carte.appendChild(age);
}
if(annonce.budget){
const budget=document.createElement("p");budget.textContent="💰 Budget/Prix : "+annonce.budget;carte.appendChild(budget);
}
if(annonce.description){
const desc=document.createElement("p");desc.textContent="📝 "+annonce.description;carte.appendChild(desc);
}

const actions=document.createElement("div");
actions.className="actions-annonce";

const appel=document.createElement("a");
appel.className="btn-appeler";
appel.href=lienTelephone(annonce.contact);
appel.textContent="📞 Appeler";

const whatsapp=document.createElement("a");
whatsapp.className="btn-whatsapp";
whatsapp.href=lienWhatsApp(annonce.contact,"Bonjour, je suis intéressé par votre annonce : "+(annonce.objet||"Annonce"));
whatsapp.target="_blank";whatsapp.rel="noopener noreferrer";whatsapp.textContent="💬 WhatsApp";

actions.appendChild(appel);actions.appendChild(whatsapp);carte.appendChild(actions);
return carte;
}

function afficherAnnonces(){
if(!listeAnnonces)return;
listeAnnonces.innerHTML="";
const recherche=normaliserTexte(rechercheAnnonce?rechercheAnnonce.value:"");

const annoncesFiltrees=ANNONCES.filter(function(annonce){
if(!annonce)return false;
if(categorieActive!=="toutes"&&normaliserTexte(annonce.categorie)!==normaliserTexte(categorieActive))return false;
if(recherche){
const contenu=normaliserTexte([annonce.objet,annonce.ville,annonce.quartier,annonce.age,annonce.budget,annonce.description,annonce.categorie].filter(Boolean).join(" "));
if(!contenu.includes(recherche))return false;
}
return true;
});

if(!annoncesFiltrees.length){
const aucune=document.createElement("div");
aucune.className="aucune-annonce";
aucune.innerHTML="🔎 <strong>Aucune annonce trouvée.</strong><br><br>Essayez une autre recherche ou sélectionnez une autre catégorie.";
listeAnnonces.appendChild(aucune);return;
}

const groupes={};
annoncesFiltrees.forEach(function(annonce){
const ville=annonce.ville||"Autre";
if(!groupes[ville])groupes[ville]=[];
groupes[ville].push(annonce);
});

Object.keys(groupes).sort(function(a,b){return a.localeCompare(b,"fr")}).forEach(function(ville){
const titreVille=document.createElement("div");
titreVille.className="titre-ville";titreVille.textContent="📍 "+ville;
listeAnnonces.appendChild(titreVille);
const groupe=document.createElement("div");
groupe.className="groupe-annonces";
groupes[ville].forEach(function(annonce){groupe.appendChild(creerCarteAnnonce(annonce))});
listeAnnonces.appendChild(groupe);
});
}


if(rechercheAnnonce)rechercheAnnonce.addEventListener("input",afficherAnnonces);

annoncesBtn.addEventListener("click",function(){
if(fenetreAnnonces)fenetreAnnonces.style.display="block";

function afficherStatuts(){

bloc.appendChild(image);

video.style.width="100%";video.style.height="auto";video.style.display="block";video.style.borderRadius="16px";
const source=document.createElement("source");source.src=statut.url;source.type=statut.mime||"video/mp4";

}else if(statut.type==="audio"){
const audio=document.createElement("audio");
audio.controls=true;audio.preload="metadata";audio.src=statut.url;audio.style.width="100%";bloc.appendChild(audio);
}else if(statut.type==="iframe"){
const iframe=document.createElement("iframe");

iframe.style.width="100%";iframe.style.minHeight="500px";iframe.style.border="0";iframe.style.borderRadius="16px";

}
