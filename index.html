<style>
:root{
--primary:#075e54;--primary2:#128c7e;--green:#25d366;

.menu.active{left:0}.menu::before{content:"ASSISTANT IA";position:absolute;top:25px;left:20px;font-size:18px;font-weight:bold;color:var(--primary)}

.annonces-header b{display:block;font-size:16px}.annonces-header small{display:block;margin-top:5px;color:#d9fff6;font-size:11px}

#listeAnnonces{width:100%;padding-bottom:10px}.groupe-annonces{display:flex;flex-direction:column;gap:12px;padding:0 10px 15px}

.actions-annonce{display:flex;gap:8px;margin-top:14px}.actions-annonce a{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;padding:9px;border-radius:22px;color:#fff;text-decoration:none;font-size:12px;font-weight:bold}
.btn-appeler{background:#1976d2}.btn-whatsapp{background:#25d366}.btn-lien-externe{background:#075e54}

</style>

<body>

<div class="header">
<button class="menu-btn" id="menuBtn" type="button">☰</button>
<div class="avatar">🌝</div>
<div><b>ASSISTANT IA LESFACILITATEURS</b><small>● En ligne</small></div>
</div>

<div class="menu" id="menu">
<button id="services" type="button">📋 Services</button>
<div id="listeServices"></div>
<button id="statuts" type="button">📺 Statuts</button>
<button id="annonces" type="button">📢 Annonces & Visibilité</button>
<button id="invite" type="button">📢 Inviter</button>

</div>

<div class="annonces-header">

</div>

<script>

/* =========================================================
   PARTIE 1 — OUTILS + DONNÉES
========================================================= */

function normaliserTexte(texte){
return String(texte || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}

function stockageGet(cle){
try{return localStorage.getItem(cle)}catch(e){return null}
}

function stockageSet(cle,valeur){
try{localStorage.setItem(cle,valeur);return true}catch(e){return false}
}

function lienWhatsApp(numero,message){
let n=String(numero||"").replace(/\D/g,"");
if(n.startsWith("0")) n="237"+n.substring(1);
return "https://wa.me/"+n+"?text="+encodeURIComponent(message||"");
}

function lienTelephone(numero){
const n=String(numero||"").replace(/[^\d+]/g,"");
return "tel:"+n;
}

/* =========================================================
   DONNÉES DE L'APPLICATION
   Toutes les données métier sont maintenant dans AI_MEMORY
   Les données métier sont intégrées directement dans AI_MEMORY.
   Elles sont récupérées localement par le moteur de conversation.
========================================================= */

let BASE_CONNAISSANCE=[];


/* =========================================================
   RÉFÉRENCES HTML
========================================================= */

const menu=document.getElementById("menu");
const menuBtn=document.getElementById("menuBtn");
const closeMenu=document.getElementById("closeMenu");
const servicesBtn=document.getElementById("services");
const listeServices=document.getElementById("listeServices");
const statutsBtn=document.getElementById("statuts");
const annoncesBtn=document.getElementById("annonces");
const inviteBtn=document.getElementById("invite");
const darkBtn=document.getElementById("dark");
const chat=document.getElementById("chat");
const messageInput=document.getElementById("message");
const sendBtn=document.getElementById("send");
const fenetreAnnonces=document.getElementById("fenetreAnnonces");
const fermerAnnonces=document.getElementById("fermerAnnonces");
const rechercheAnnonce=document.getElementById("rechercheAnnonce");
const categoriesAnnonces=document.getElementById("categoriesAnnonces");
const listeAnnonces=document.getElementById("listeAnnonces");
const fenetreStatuts=document.getElementById("fenetreStatuts");
const fermerStatuts=document.getElementById("fermerStatuts");
const listeStatuts=document.getElementById("listeStatuts");


/* =========================================================
   MENU PRINCIPAL
========================================================= */

if(menuBtn){
menuBtn.addEventListener("click",function(e){e.stopPropagation();if(menu)menu.classList.toggle("active")});
}
if(closeMenu){
closeMenu.addEventListener("click",function(){if(menu)menu.classList.remove("active")});
}
document.addEventListener("click",function(e){
if(menu&&menu.classList.contains("active")&&!menu.contains(e.target)&&e.target!==menuBtn)menu.classList.remove("active");
});


/* =========================================================
   SERVICES
========================================================= */

function afficherServicesMenu(){
if(!listeServices)return;
listeServices.innerHTML="";
const services=[];
(AI_MEMORY?.connaissances||[]).forEach(function(item){
 const q=Array.isArray(item.questions)?item.questions[0]:"";
 if(q && q.length>2)services.push(q);
});
if(!services.length){
 const b=document.createElement("button");b.type="button";b.textContent="🤖 Demander un service à l’IA";
 b.onclick=function(){envoyerMessage("Quels sont vos services ?");if(menu)menu.classList.remove("active");};
 listeServices.appendChild(b);
 return;
}
services.forEach(function(service){
 const bouton=document.createElement("button"); bouton.type="button"; bouton.textContent="💡 "+service;
 bouton.addEventListener("click",function(){envoyerMessage("Je souhaite des informations sur "+service);if(menu)menu.classList.remove("active");listeServices.style.display="none";});
 listeServices.appendChild(bouton);
});
}

if(servicesBtn&&listeServices){
listeServices.style.display="none";
servicesBtn.addEventListener("click",function(e){
e.stopPropagation();
listeServices.style.display=(listeServices.style.display==="none"||listeServices.style.display==="")?"block":"none";
});
}


/* =========================================================
   MESSAGES
========================================================= */

function urlSecurisee(url){
try{const u=new URL(url);return u.protocol==="https:"||u.protocol==="http:"?u.href:null}catch(e){return null}
}
function typeMedia(url){
const propre=String(url||"");
const sansFragment=propre.split("#")[0];
const partie=sansFragment.split("?")[0].toLowerCase();
const domaine=partie.replace(/^https?:\/\//,"").split("/")[0];
if(/\.(jpe?g|png|gif|webp|bmp|svg)$/.test(partie))return "image";
if(/\.(mp4|webm|m4v|mov|ogv|m3u8)$/.test(partie))return "video";
if(/\.(mp3|wav|m4a|aac|oga|ogg|flac)$/.test(partie))return "audio";
if(domaine.indexOf("youtube.com")!==-1||domaine.indexOf("youtu.be")!==-1||domaine.indexOf("youtube-nocookie.com")!==-1)return "youtube";
if(domaine.indexOf("soundcloud.com")!==-1)return "soundcloud";
return "link";
}
function obtenirLienYouTube(url){
try{
const u=new URL(url);const host=u.hostname.toLowerCase();let id="";
if(host.indexOf("youtu.be")!==-1)id=u.pathname.replace(/^\//,"").split("/")[0];
else if(host.indexOf("youtube.com")!==-1){id=u.searchParams.get("v")||"";if(!id&&u.pathname.indexOf("/shorts/")===0)id=u.pathname.split("/")[2]||"";if(!id&&u.pathname.indexOf("/embed/")===0)id=u.pathname.split("/")[2]||"";}
return id;
}catch(e){return "";}
}
function lancerLectureAutomatique(media,muet){
try{
if(muet!==undefined)media.muted=muet;
const prom=media.play();
if(prom&&typeof prom.catch==="function")prom.catch(function(){
const bouton=document.createElement("button");bouton.type="button";bouton.textContent="▶️ Lire maintenant";bouton.style.marginTop="8px";bouton.style.padding="10px 14px";bouton.style.border="0";bouton.style.borderRadius="10px";bouton.style.background="#075e54";bouton.style.color="#fff";bouton.style.fontWeight="bold";
bouton.onclick=function(){media.muted=false;media.play();bouton.remove();};if(media.parentNode)media.parentNode.appendChild(bouton);
});
}catch(e){}
}
function ajouterMediaChat(parent,url){
const propre=urlSecurisee(url);if(!propre)return false;const type=typeMedia(propre);if(type==="link")return false;
const bloc=document.createElement("div");bloc.className="media-message";
if(type==="image"){
const img=document.createElement("img");img.src=propre;img.loading="lazy";img.alt="Image";img.onclick=function(){window.open(propre,"_blank","noopener,noreferrer")};bloc.appendChild(img);
}else if(type==="video"){
const video=document.createElement("video");video.controls=true;video.playsInline=true;video.autoplay=true;video.preload="auto";video.src=propre;video.style.width="100%";video.style.maxHeight="70vh";video.style.borderRadius="12px";bloc.appendChild(video);video.addEventListener("loadedmetadata",function(){lancerLectureAutomatique(video,true);});
}else if(type==="audio"){
const audio=document.createElement("audio");audio.controls=true;audio.autoplay=true;audio.preload="auto";audio.src=propre;audio.style.width="100%";bloc.appendChild(audio);audio.addEventListener("canplay",function(){lancerLectureAutomatique(audio,false);});
}else if(type==="youtube"){
const id=obtenirLienYouTube(propre);if(!id)return false;const iframe=document.createElement("iframe");iframe.src="https://www.youtube.com/embed/"+encodeURIComponent(id)+"?autoplay=1&playsinline=1";iframe.style.width="100%";iframe.style.minHeight="260px";iframe.style.border="0";iframe.style.borderRadius="12px";iframe.allow="autoplay; encrypted-media; picture-in-picture";iframe.allowFullscreen=true;bloc.appendChild(iframe);
}else if(type==="soundcloud"){
const lien=document.createElement("a");lien.href=propre;lien.target="_blank";lien.rel="noopener noreferrer";lien.textContent="🎵 Ouvrir et écouter sur SoundCloud";lien.style.display="block";lien.style.padding="14px";lien.style.background="#075e54";lien.style.color="#fff";lien.style.borderRadius="12px";lien.style.textDecoration="none";lien.style.fontWeight="bold";bloc.appendChild(lien);
}
const cap=document.createElement("div");cap.className="media-caption";cap.textContent=propre;bloc.appendChild(cap);parent.appendChild(bloc);return true;
}
function rendreContenuChat(parent,texte){
const lignes=String(texte||"").split("\n");
const re=/https?:\/\/[^\s<]+/g;
lignes.forEach(function(ligne,index){
 let dernier=0,match;
 while((match=re.exec(ligne))!==null){
  let url=match[0].replace(/[),.!?;:]+$/g,"");
  if(match.index>dernier)parent.appendChild(document.createTextNode(ligne.slice(dernier,match.index)));
  if(!ajouterMediaChat(parent,url)){
   const lien=document.createElement("a");lien.href=urlSecurisee(url)||"#";lien.target="_blank";lien.rel="noopener noreferrer";lien.textContent=url;lien.style.color="#075e54";lien.style.fontWeight="bold";parent.appendChild(lien);
  }
  dernier=match.index+url.length;
 }
 if(dernier<ligne.length)parent.appendChild(document.createTextNode(ligne.slice(dernier)));
 if(index<lignes.length-1)parent.appendChild(document.createElement("br"));
});
}
function ajouterMessage(texte,type){
if(!chat)return null;const message=document.createElement("div");message.className="message "+(type==="user"?"user":"ai");rendreContenuChat(message,texte);chat.appendChild(message);chat.scrollTop=chat.scrollHeight;return message;
}
function afficherReponseIA(texte){return ajouterMessage(texte,"ai");}

/* =========================================================
   IA — MOTEUR DE RECHERCHE + DIALOGUE CONTEXTUEL
   L'assistant cherche dans toute la mémoire :
   connaissances, services, annonces, recommandations et médias.
   Pour les recherches d'emploi, immobilier et emplacements,
   il collecte la ville/quartier lorsque cette information est nécessaire.
========================================================= */
const ETAT_CONVERSATION={
 intention:null,
 ville:null,
 quartier:null,
 termes:[],
 enAttente:null,
 dernierResultat:null
};

/* =========================================================
   MÉMOIRE CONVERSATIONNELLE
   L'IA ne considère jamais une ancienne ville comme définitive.
   Une nouvelle ville remplace immédiatement l'ancienne et lance
   une nouvelle recherche avec la même intention si nécessaire.
========================================================= */
function tokensTexte(texte){
 return normaliserTexte(texte).split(/[^a-z0-9]+/).filter(x=>x.length>=2);
}
function extraireVilleQuartier(texte){
 const original=String(texte||'').trim();
 const n=normaliserTexte(original);
 const villes=[
  ['yaounde','Yaoundé'],['douala','Douala'],['bafoussam','Bafoussam'],['garoua','Garoua'],
  ['maroua','Maroua'],['bamenda','Bamenda'],['bertoa','Bertoua'],['buea','Buea'],
  ['limbe','Limbé'],['kribi','Kribi'],['edea','Edéa'],['nkongsamba','Nkongsamba'],
  ['mbalmayo','Mbalmayo'],['ebolowa','Ebolowa'],['ngaoundere','Ngaoundéré']
 ];
 let ville=null;
 for(const [cle,nom] of villes){if(new RegExp('(^|\\s)'+cle+'(\\s|$)','i').test(n)){ville=nom;break;}}
 let quartier=null;
 const mq=original.match(/(?:quartier|au quartier|dans le quartier)\s+([A-Za-zÀ-ÿ0-9' -]{2,45})/i);
 if(mq) quartier=mq[1].trim().replace(/[.,!?;:]+$/,'');
 return {ville,quartier};
}
function detecterIntention(t){
 const n=normaliserTexte(t);
 if(/\b(emplacement|terrain|local|boutique|espace|parcelle)\b/.test(n))return 'emplacement';
 if(/\b(emploi|travail|job|recrutement|recherche emploi|cherche travail|poste|embauche|menagere|nounou|chauffeur|macon|technicien|electricien|plombier|charpentier|mecanicien)\b/.test(n))return 'emplois';
 if(/\b(immobilier|maison|chambre|studio|appartement|villa|louer|location|logement)\b/.test(n))return 'immobilier';
 if(/\b(agronomie|poulet|poulets|mais|porcelet|porcelets|elevage|agricole)\b/.test(n))return 'agronomie';
 if(/\b(samsung|telephone|smart tv|chaussure|acheter|vente|vend|commerce|produit)\b/.test(n))return 'e-commerce';
 if(/\b(animal|chien|chiot|chiots)\b/.test(n))return 'animal';
 if(/\b(realisations|realisation|projet|construction|btp)\b/.test(n))return 'réalisation';
 return null;
}
function estDemandeDeLocalisation(t){
 const n=normaliserTexte(t);
 return /\b(ou|ville|quartier|localisation|situe|situee|situes|situees|proche|pres|vers|cote)\b/.test(n);
}
function nomIntention(intention){
 return {emplois:'emploi',immobilier:'immobilier',emplacement:'emplacement',agronomie:'agronomie','e-commerce':'produit',animal:'animal','réalisation':'réalisation'}[intention]||'information';
}
function rechercherAnnonces(intention,ville,quartier,texte){
 const source=Array.isArray(AI_MEMORY?.annonces)?AI_MEMORY.annonces:[];
 const n=normaliserTexte(texte);
 let resultats=source.filter(a=>{
  if(!a)return false;
  const cat=normaliserTexte(a.categorie);
  if(intention){
   if(intention==='immobilier' && cat!=='immobilier')return false;
   else if(intention==='emplacement' && cat!=='emplacement')return false;
   else if(intention!=='immobilier'&&intention!=='emplacement'&&cat!==normaliserTexte(intention))return false;
  }
  if(ville && normaliserTexte(a.ville)!==normaliserTexte(ville))return false;
  if(quartier && normaliserTexte(a.quartier)!==normaliserTexte(quartier))return false;
  return true;
 });
 const stop=new Set(['cherche','recherche','donne','moi','une','des','dans','pour','avec','bonjour','salut','je','veux','voir','offres','ville','quartier','a','à','de','du','la','le','les','et']);
 const mots=tokensTexte(n).filter(x=>!stop.has(x));
 if(mots.length&&resultats.length>1){
  const classes=resultats.map(a=>({a,score:mots.reduce((s,m)=>s+(normaliserTexte([a.objet,a.description,a.budget,a.ville,a.quartier].join(' ')).includes(m)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  if(classes.length)resultats=classes.map(x=>x.a);
 }
 return resultats;
}
function formatAnnonce(a){
 return '• '+(a.objet||'Annonce')+'\n  📍 '+[a.ville,a.quartier].filter(Boolean).join(' — ')+(a.budget?'\n  💰 '+a.budget:'')+(a.age?'\n  👤 '+a.age:'')+(a.description?'\n  📝 '+a.description:'')+(a.contact?'\n  📞 '+a.contact:'');
}
function reponseAnnonces(intention,ville,quartier,texte){
 const resultats=rechercherAnnonces(intention,ville,quartier,texte);
 if(!resultats.length){
  ETAT_CONVERSATION.dernierResultat=[];
  const lieu=[ville,quartier].filter(Boolean).join(' — ');
  return `🔎 Je ne trouve aucune offre ${nomIntention(intention)}${lieu?' pour '+lieu:''}.\n\n👉 Vous pouvez me donner une autre ville, un autre quartier ou changer de recherche.`;
 }
 ETAT_CONVERSATION.dernierResultat=resultats;
 const titre=intention==='emplois'?'💼 Offres d’emploi':intention==='immobilier'?'🏠 Offres immobilières':intention==='emplacement'?'📍 Emplacements disponibles':'📋 Résultats';
 const lieu=[ville,quartier].filter(Boolean).join(' — ');
 return titre+(lieu?' pour '+lieu:'')+' :\n\n'+resultats.slice(0,30).map(formatAnnonce).join('\n\n')+(resultats.length>30?'\n\n… et '+(resultats.length-30)+' autre(s).':'');
}
function chercherDansTouteLaMemoire(texte){
 const n=normaliserTexte(texte);if(!n)return null;
 let meilleur=null,scoreMax=0;
 const mots=tokensTexte(n).filter(x=>x.length>=3);
 (AI_MEMORY.connaissances||[]).forEach(item=>{
  (item.questions||[]).forEach(q=>{
   const k=normaliserTexte(q),qt=tokensTexte(k);let score=0;
   if(n===k)score=1000;
   else if(n.includes(k))score=700+k.length;
   else if(k.includes(n)&&n.length>=4)score=500+n.length;
   else score=mots.reduce((s,m)=>s+(qt.includes(m)?35:0),0);
   if(score>scoreMax){scoreMax=score;meilleur=item.reponse||'';}
  });
 });
 (AI_MEMORY.services||[]).forEach(x=>{
  const k=normaliserTexte(x.nom||'');
  if(k&&n.includes(k)&&scoreMax<300){scoreMax=300;meilleur='🛠️ '+x.nom+'\n\nJe peux vous donner les informations disponibles sur ce service. Dites-moi ce que vous souhaitez savoir.';}
 });
 (AI_MEMORY.recommandations||[]).forEach(x=>{
  const c=normaliserTexte([x.titre,x.texte].join(' '));
  const sc=mots.reduce((s,m)=>s+(c.includes(m)?18:0),0);
  if(sc>scoreMax){scoreMax=sc;meilleur=[x.texte,x.url].filter(Boolean).join('\n\n');}
 });
 return scoreMax>=35?meilleur:null;
}
function obtenirReponse(texte){
 const brut=String(texte||'').trim(),t=normaliserTexte(brut);
 if(!t)return 'Écrivez votre demande et je vais vous aider. 😊';

 const loc=extraireVilleQuartier(brut);
 const intentionNouvelle=detecterIntention(brut);
 const ancienneVille=ETAT_CONVERSATION.ville;

 /* Une ville explicitement donnée est toujours prioritaire.
    Elle remplace l'ancienne : aucune donnée de l'ancienne ville
    ne doit rester dans le résultat. */
 if(loc.ville && normaliserTexte(loc.ville)!==normaliserTexte(ancienneVille||'')){
  ETAT_CONVERSATION.ville=loc.ville;
  ETAT_CONVERSATION.quartier=loc.quartier||null;
  ETAT_CONVERSATION.dernierResultat=null;
 }else if(loc.ville){
  ETAT_CONVERSATION.ville=loc.ville;
 }
 if(loc.quartier)ETAT_CONVERSATION.quartier=loc.quartier;
 if(intentionNouvelle && intentionNouvelle!==ETAT_CONVERSATION.intention){
  ETAT_CONVERSATION.intention=intentionNouvelle;
  ETAT_CONVERSATION.termes=tokensTexte(brut);
  ETAT_CONVERSATION.dernierResultat=null;
 }else if(intentionNouvelle){
  ETAT_CONVERSATION.intention=intentionNouvelle;
 }

 const intention=ETAT_CONVERSATION.intention;
 const rechercheLocale=['emplois','immobilier','emplacement'].includes(intention);

 if(rechercheLocale){
  const ville=ETAT_CONVERSATION.ville,quartier=ETAT_CONVERSATION.quartier;
  if(!ville){
   ETAT_CONVERSATION.enAttente='ville';
   return intention==='emplois'?'💼 Très bien. Dans quelle ville recherchez-vous un emploi ? 📍':intention==='immobilier'?'🏠 Très bien. Dans quelle ville recherchez-vous votre logement ? 📍':'📍 Très bien. Dans quelle ville recherchez-vous cet emplacement ?';
  }
  ETAT_CONVERSATION.enAttente=null;
  return reponseAnnonces(intention,ville,quartier,brut);
 }

 /* Une réponse courte comme « Douala », « Bastos » ou « Yaoundé »
    continue la conversation au lieu de repartir de zéro. */
 if((loc.ville||loc.quartier)&&intention&&['emplois','immobilier','emplacement'].includes(intention)){
  return reponseAnnonces(intention,ETAT_CONVERSATION.ville,ETAT_CONVERSATION.quartier,brut);
 }

 const directe=chercherDansTouteLaMemoire(brut);
 if(directe)return directe;

 /* Si la question est ambiguë, l'IA demande une précision plutôt
    que de choisir arbitrairement une ancienne réponse. */
 const mots=tokensTexte(brut).filter(x=>x.length>=3);
 if(mots.length<=2){
  return '🤖 Je veux être précis. Pouvez-vous préciser ce que vous recherchez ?\n\nExemple : emploi, studio, terrain, produit, service, ou indiquez simplement la ville et le quartier.';
 }
 return '🤖 Je n’ai pas trouvé une correspondance suffisamment précise dans ma mémoire.\n\n👉 Précisez le type de recherche, la ville ou le quartier et je reprendrai la recherche au bon endroit.';
}

function detecterMediaUrl(url){
 try{const path=new URL(url).pathname.toLowerCase();
  if(/\.(jpg|jpeg|png|gif|webp|avif|svg)(?:$|[?#])/.test(path)) return "image";
  if(/\.(mp4|webm|ogg|mov|m4v)(?:$|[?#])/.test(path)) return "video";
 }catch(e){}
 return "externe";
}

function ajouterDescriptionAvecLiens(parent, texte){
 const brut=String(texte||"");
 const regex=/(https?:\/\/[^\s<]+)/gi;
 let dernier=0,match;
 while((match=regex.exec(brut))){
  if(match.index>dernier) parent.appendChild(document.createTextNode(brut.slice(dernier,match.index)));
  let url=match[0].replace(/[),.;!?]+$/g,"");
  const reste=match[0].slice(url.length);
  if(urlSecurisee(url)){
   const type=detecterMediaUrl(url);
   if(type==="image"){
    const img=document.createElement("img"); img.src=url; img.alt="Image liée à l'annonce"; img.loading="lazy"; img.style.width="100%"; img.style.maxHeight="500px"; img.style.objectFit="contain"; img.style.display="block"; img.style.borderRadius="16px"; img.style.margin="12px 0"; img.onerror=()=>img.remove(); parent.appendChild(img);
   }else if(type==="video"){
    const video=document.createElement("video"); video.controls=true; video.playsInline=true; video.preload="metadata"; video.src=url; video.style.width="100%"; video.style.maxHeight="500px"; video.style.display="block"; video.style.borderRadius="16px"; video.style.margin="12px 0"; video.onerror=()=>video.remove(); parent.appendChild(video);
   }else{
    const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=url; a.style.color="#0b84ff"; a.style.fontWeight="700"; a.style.wordBreak="break-all"; parent.appendChild(a);
   }
  }else parent.appendChild(document.createTextNode(url));
  if(reste) parent.appendChild(document.createTextNode(reste));
  dernier=match.index+match[0].length;
 }
 if(dernier<brut.length) parent.appendChild(document.createTextNode(brut.slice(dernier)));
}
